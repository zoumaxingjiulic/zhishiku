name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            services/api/requirements.txt
            services/worker/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: pip install -r requirements-test.txt
      - run: pip install ./shared/python
      - run: python tools/check_repository_hygiene.py
      - run: python -m pytest -q
      - run: npm ci
        working-directory: services/frontend
      - run: npm run lint
        working-directory: services/frontend
      - run: npm run typecheck
        working-directory: services/frontend
      - run: npm test
        working-directory: services/frontend
      - run: npm run build
        working-directory: services/frontend
      - run: docker compose --env-file .env.example -f deploy/docker-compose.yml -f deploy/docker-compose.models.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Check API Dockerfile
        run: docker build --check -f services/api/Dockerfile .
      - name: Check Worker Dockerfile
        run: docker build --check -f services/worker/Dockerfile .
      - name: Check Frontend Dockerfile
        run: docker build --check -f services/frontend/Dockerfile services/frontend
