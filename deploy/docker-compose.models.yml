services:
  api:
    depends_on:
      infinity: {condition: service_healthy}

  infinity:
    image: michaelf34/infinity:latest-cpu
    restart: unless-stopped
    command: >
      v2 --engine torch
      --model-id /models/bge-m3
      --served-model-name BAAI/bge-m3
      --model-id /models/bge-reranker-v2-m3
      --served-model-name BAAI/bge-reranker-v2-m3
      --port 7997
    environment:
      HF_HOME: /app/.cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "16"
    volumes:
      - ${DATA_ROOT}/models/infinity:/app/.cache
      - ${DATA_ROOT}/models/source:/models:ro
    cpus: 16
    mem_limit: 24g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7997/models', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 10
    networks:
      - kb-internal
